{% extends "layout.html" %}
{% block content %}
<header class="page-header mb-8">
    <h1 class="text-4xl font-bold text-orange-600">Problem Melden</h1>
</header>

<div class="max-w-2xl mx-auto animate-slide-up">
    <form action="{{ url_for('report.report_problem') }}" method="POST" class="card">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
        <div class="mb-5 flex flex-col sm:flex-row gap-4">
            <div class="flex-1">
                <label for="name" class="block text-gray-400 text-sm mb-2">Name:</label>
                <input type="text" id="name" name="name" required class="form-input">
            </div>
            <div class="flex-1">
                <label for="vorname" class="block text-gray-400 text-sm mb-2">Vorname:</label>
                <input type="text" id="vorname" name="vorname" required class="form-input">
            </div>
        </div>

        <div class="mb-5">
            <label for="email" class="block text-gray-400 text-sm mb-2">Email Adresse:</label>
            <input type="email" id="email" name="email" required class="form-input">
            <span id="email-error" class="text-red-500 text-sm mt-1 block"></span>
        </div>

        <div class="mb-6">
            <label for="issue" class="block text-gray-400 text-sm mb-2">Problembeschreibung:</label>
            <textarea id="issue" name="issue" rows="8" maxlength="1000" required class="form-input resize-y"></textarea>
        </div>

        <input type="hidden" id="bot-field" name="bot-field">
        <button type="submit" class="btn-primary w-full sm:w-auto">Absenden</button>
    </form>
</div>
<script src="{{ url_for('static', filename='js/reportProblem.js') }}"></script>
{% endblock %}
