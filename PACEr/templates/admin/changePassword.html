{% extends "admin/adminTools.html" %}

{% block adminContent %}
<div class="ml-0 md:ml-4 max-w-md">
    <h2 class="section-header mb-6">Passwort ändern</h2>

    <form method="POST" action="{{ url_for('admin.change_password') }}" class="card">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">

        <div class="mb-5">
            <label for="current_password" class="block text-gray-400 text-sm mb-2">Aktuelles Passwort</label>
            <input type="password" id="current_password" name="current_password" required
                class="form-input" autocomplete="current-password">
        </div>

        <div class="mb-5">
            <label for="new_password" class="block text-gray-400 text-sm mb-2">Neues Passwort (min. 8 Zeichen)</label>
            <input type="password" id="new_password" name="new_password" required minlength="8"
                class="form-input" autocomplete="new-password">
        </div>

        <div class="mb-6">
            <label for="confirm_password" class="block text-gray-400 text-sm mb-2">Neues Passwort bestätigen</label>
            <input type="password" id="confirm_password" name="confirm_password" required minlength="8"
                class="form-input" autocomplete="new-password">
        </div>

        <button type="submit" class="btn-primary">Passwort ändern</button>
    </form>
</div>
{% endblock %}
