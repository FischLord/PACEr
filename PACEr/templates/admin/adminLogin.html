{% extends "layout.html" %} {% block content %}
<header class="page-header mb-4">
    <h1 class="text-4xl font-bold text-orange-600 md:text-left text-center">Admin Login</h1>
</header>

<div class="max-w-md mx-auto mt-8 animate-fade-in">
    <form action="{{ url_for('admin.admin_login') }}" method="POST" class="card">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
        <div class="mb-4">
            <label for="username" class="block text-gray-400 mb-2">Benutzername:</label>
            <input type="text" id="username" name="username" required
                class="form-input" placeholder="Benutzername" autocomplete="username">
        </div>
        <div class="mb-6">
            <label for="password" class="block text-gray-400 mb-2">Passwort:</label>
            <input type="password" id="password" name="password" required
                class="form-input" placeholder="Passwort eingeben" autocomplete="current-password">
        </div>
        <button type="submit" class="btn-primary w-full">Anmelden</button>
    </form>
</div>
{% endblock %}
