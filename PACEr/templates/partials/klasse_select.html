{% if klassen %}
<div>
    <label for="klasse-{{ form_target_id|default('form-area') }}" class="form-label">Klasse</label>
    <select id="klasse-{{ form_target_id|default('form-area') }}" name="klasse" class="form-select">
        <option value="">Keine Klasse</option>
        {% for k in klassen %}
        <option value="{{ k }}" {% if selected_klasse == k %}selected{% endif %}>{{ k }}</option>
        {% endfor %}
    </select>
</div>
{% endif %}
