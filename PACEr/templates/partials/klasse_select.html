{% if klassen %}
<div>
    <label for="klasse" class="block text-gray-400 text-sm mb-2">Klasse</label>
    <select id="klasse" name="klasse" class="form-select">
        <option value="">Keine Klasse</option>
        {% for k in klassen %}
        <option value="{{ k }}">{{ k }}</option>
        {% endfor %}
    </select>
</div>
{% endif %}
