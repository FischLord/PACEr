{% extends "base.html" %}

{% block title %}Admin Login - TurnierManager{% endblock %}

{% block content %}
<div class="flex min-h-full flex-col justify-center py-12 sm:px-6 lg:px-8">
    <div class="sm:mx-auto sm:w-full sm:max-w-md">
        <h2 class="mt-6 text-center text-2xl font-bold leading-9 tracking-tight text-gray-900">
            Admin-Bereich
        </h2>
        <p class="mt-2 text-center text-sm text-gray-600">
            Bitte melde dich an, um fortzufahren.
        </p>
    </div>

    <div class="mt-10 sm:mx-auto sm:w-full sm:max-w-sm">
        <form class="space-y-6" action="{{ url_for('auth.login') }}" method="POST">
            <div>
                <label for="password" class="block text-sm font-medium leading-6 text-gray-900">
                    Passwort
                </label>
                <div class="mt-2">
                    <input id="password" name="password" type="password" autocomplete="current-password" required
                           class="block w-full rounded-md border-0 py-2 px-3 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-primary-600">
                </div>
            </div>

            <div>
                <button type="submit"
                        class="flex w-full justify-center rounded-md bg-primary-600 px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-primary-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-600">
                    Anmelden
                </button>
            </div>
        </form>

        <p class="mt-10 text-center text-sm text-gray-500">
            <a href="{{ url_for('main.index') }}" class="font-semibold leading-6 text-primary-600 hover:text-primary-500">
                &larr; Zurück zur Startseite
            </a>
        </p>
    </div>
</div>
{% endblock %}
