{% extends "base.html" %}

{% block title %}{% if tournament %}Turnier bearbeiten{% else %}Neues Turnier{% endif %} - Admin{% endblock %}

{% block content %}
<div class="mx-auto max-w-2xl px-4 sm:px-6 lg:px-8 py-8">
    <div class="mb-8">
        <a href="{{ url_for('admin.tournaments') }}" class="text-primary-600 hover:text-primary-500 text-sm font-medium">
            &larr; Zurück zu Turniere
        </a>
        <h1 class="text-2xl font-bold text-gray-900 mt-2">
            {% if tournament %}Turnier bearbeiten{% else %}Neues Turnier{% endif %}
        </h1>
    </div>

    <form method="POST" class="bg-white shadow-sm rounded-lg border border-gray-200 p-6 space-y-6">
        <div>
            <label for="name" class="block text-sm font-medium text-gray-700">Name *</label>
            <input type="text" name="name" id="name" required
                   value="{{ tournament.name if tournament else '' }}"
                   class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-primary-500 focus:ring-primary-500 border py-2 px-3">
        </div>

        <div>
            <label for="location" class="block text-sm font-medium text-gray-700">Ort</label>
            <input type="text" name="location" id="location"
                   value="{{ tournament.location if tournament else '' }}"
                   class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-primary-500 focus:ring-primary-500 border py-2 px-3">
        </div>

        <div>
            <label for="date" class="block text-sm font-medium text-gray-700">Datum</label>
            <input type="date" name="date" id="date"
                   value="{{ tournament.date.strftime('%Y-%m-%d') if tournament and tournament.date else '' }}"
                   class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-primary-500 focus:ring-primary-500 border py-2 px-3">
        </div>

        <div class="pt-4">
            <button type="submit" class="rounded-md bg-primary-600 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-primary-500">
                {% if tournament %}Speichern{% else %}Erstellen{% endif %}
            </button>
        </div>
    </form>
</div>
{% endblock %}
